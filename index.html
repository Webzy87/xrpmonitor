<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XRP Exchange Monitor - Jon's Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { background: #0f172a; color: #e2e8f0; }
        .card { background: #1e2937; }
        table { border-collapse: collapse; }
        th, td { padding: 8px 12px; text-align: right; }
        th { text-align: left; }
        .positive { color: #22c55e; }
        .negative { color: #ef4444; }
    </style>
</head>
<body class="min-h-screen p-6">
    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-4xl font-bold flex items-center gap-3">
                    <i class="fas fa-chart-line text-blue-400"></i> XRP Exchange Monitor
                </h1>
                <p class="text-slate-400">Live • webzy87 • Auto-refreshes every 30s</p>
            </div>
            <button onclick="refreshAll()" class="bg-blue-600 hover:bg-blue-700 px-6 py-2 rounded-lg flex items-center gap-2">
                <i class="fas fa-sync"></i> Refresh Now
            </button>
        </header>

        <!-- Stats -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8" id="stats"></div>

        <!-- Exchange Volumes -->
        <div class="card rounded-xl p-6 mb-8">
            <h2 class="text-2xl font-semibold mb-4 flex items-center gap-2"><i class="fas fa-exchange-alt"></i> Top Exchange Volumes (24h)</h2>
            <div id="exchanges" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
        </div>

        <!-- Recent Trades -->
        <div class="card rounded-xl p-6 mb-8">
            <h2 class="text-2xl font-semibold mb-4 flex items-center gap-2"><i class="fas fa-list"></i> Recent Binance XRPUSDT Trades</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-sm" id="trades-table">
                    <thead><tr class="border-b border-slate-600"><th>Time</th><th>Price</th><th>Qty</th><th>Total USD</th></tr></thead>
                    <tbody id="trades-body"></tbody>
                </table>
            </div>
        </div>

        <!-- Order Book -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="card rounded-xl p-6">
                <h2 class="text-2xl font-semibold mb-4 flex items-center gap-2"><i class="fas fa-arrow-up text-green-400"></i> Bids (Buy Wall)</h2>
                <div id="bids" class="max-h-96 overflow-auto text-sm"></div>
            </div>
            <div class="card rounded-xl p-6">
                <h2 class="text-2xl font-semibold mb-4 flex items-center gap-2"><i class="fas fa-arrow-down text-red-400"></i> Asks (Sell Wall)</h2>
                <div id="asks" class="max-h-96 overflow-auto text-sm"></div>
            </div>
        </div>

        <footer class="text-center text-slate-500 mt-12 text-sm">
            Using public APIs + CORS proxy • Data refreshes automatically
        </footer>
    </div>

    <script>
        const CORS_PROXY = "https://api.codetabs.com/v1/proxy?quest=";  // Reliable free proxy

        async function fetchJSON(url) {
            try {
                const res = await fetch(CORS_PROXY + encodeURIComponent(url));
                if (!res.ok) throw new Error("HTTP " + res.status);
                return await res.json();
            } catch(e) {
                console.error("Fetch error:", e);
                return null;
            }
        }

        async function loadMarketData() {
            const xrp = await fetchJSON("https://api.coingecko.com/api/v3/coins/ripple?localization=false&tickers=false&market_data=true");
            if (!xrp) return;
            const m = xrp.market_data;
            const statsHTML = `
                <div class="card rounded-xl p-6">
                    <div class="text-5xl font-mono font-bold">$${m.current_price.usd.toFixed(4)}</div>
                    <div class="text-xl ${m.price_change_percentage_24h >= 0 ? 'positive' : 'negative'}">
                        ${m.price_change_percentage_24h?.toFixed(2)}% (24h)
                    </div>
                    <div class="mt-4 grid grid-cols-2 gap-4 text-sm">
                        <div>MCap: $${(m.market_cap.usd/1e9).toFixed(1)}B</div>
                        <div>Vol: $${(m.total_volume.usd/1e9).toFixed(1)}B</div>
                    </div>
                </div>
                <!-- more stats cards... (same as before) -->
            `;
            document.getElementById('stats').innerHTML = statsHTML;  // Expand if needed
        }

        async function loadExchanges() {
            const data = await fetchJSON("https://api.coingecko.com/api/v3/coins/ripple/tickers");
            if (!data) return;
            const top = data.tickers.slice(0,8).filter(t => ['Binance','Coinbase','Kraken','Bybit'].some(ex => t.market.name.includes(ex)));
            let html = '';
            top.forEach(t => {
                const change = t.last > (t.open || t.last) ? 'positive' : 'negative';
                html += `
                    <div class="card p-4 text-sm">
                        <div class="font-semibold">${t.market.name}</div>
                        <div class="text-xl ${change}">${t.last}</div>
                        <div class="text-xs opacity-75">Vol: ~$${(t.volume * t.last / 1e6).toFixed(1)}M</div>
                    </div>
                `;
            });
            document.getElementById('exchanges').innerHTML = html || '<p class="col-span-full text-slate-400">Loading exchanges...</p>';
        }

        async function loadRecentTrades() {
            const trades = await fetchJSON("https://api.binance.com/api/v3/trades?symbol=XRPUSDT&limit=20");
            if (!trades) return;
            let html = '';
            trades.forEach(t => {
                const isBuy = t.isBuyerMaker === false;
                html += `
                    <tr class="border-b border-slate-700 hover:bg-slate-800 ${isBuy ? 'text-green-400' : 'text-red-400'}">
                        <td>${new Date(t.time).toLocaleTimeString()}</td>
                        <td>${parseFloat(t.price).toFixed(4)}</td>
                        <td>${parseFloat(t.qty).toFixed(2)}</td>
                        <td>$${(parseFloat(t.price) * parseFloat(t.qty)).toFixed(0)}</td>
                    </tr>
                `;
            });
            document.getElementById('trades-body').innerHTML = html;
        }

        async function loadOrderBook() {
            const book = await fetchJSON("https://api.binance.com/api/v3/depth?symbol=XRPUSDT&limit=20");
            if (!book) return;

            // Bids (simplified)
            let bidsHTML = '<table class="w-full"><thead><tr><th>Price</th><th>Amount</th><th>Cum</th></tr></thead><tbody>';
            let cum = 0;
            book.bids.forEach(b => {
                const p = parseFloat(b[0]), a = parseFloat(b[1]);
                cum += a;
                bidsHTML += `<tr class="text-green-400"><td>${p.toFixed(4)}</td><td>${a.toFixed(2)}</td><td>${cum.toFixed(0)}</td></tr>`;
            });
            bidsHTML += '</tbody></table>';
            document.getElementById('bids').innerHTML = bidsHTML;

            // Asks
            let asksHTML = '<table class="w-full"><thead><tr><th>Price</th><th>Amount</th><th>Cum</th></tr></thead><tbody>';
            cum = 0;
            book.asks.forEach(a => {
                const p = parseFloat(a[0]), amt = parseFloat(a[1]);
                cum += amt;
                asksHTML += `<tr class="text-red-400"><td>${p.toFixed(4)}</td><td>${amt.toFixed(2)}</td><td>${cum.toFixed(0)}</td></tr>`;
            });
            asksHTML += '</tbody></table>';
            document.getElementById('asks').innerHTML = asksHTML;
        }

        async function refreshAll() {
            document.getElementById('stats').innerHTML = '<p class="col-span-3 text-center">Loading market data...</p>';
            await Promise.all([loadMarketData(), loadExchanges(), loadRecentTrades(), loadOrderBook()]);
        }

        window.onload = () => {
            refreshAll();
            setInterval(refreshAll, 30000);
        };
    </script>
</body>
</html>
