<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XRP Exchange Monitor - Jon's Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { background: #0f172a; color: #e2e8f0; }
        .card { background: #1e2937; }
        .positive { color: #22c55e; }
        .negative { color: #ef4444; }
    </style>
</head>
<body class="min-h-screen p-6">
    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-4xl font-bold flex items-center gap-3">
                    <i class="fas fa-chart-line text-blue-400"></i> XRP Exchange Monitor
                </h1>
                <p class="text-slate-400">webzy87 • Auto 30s refresh</p>
            </div>
            <button onclick="refreshAll()" class="bg-blue-600 hover:bg-blue-700 px-6 py-2 rounded-lg flex items-center gap-2">
                <i class="fas fa-sync"></i> Refresh
            </button>
        </header>

        <div id="status" class="text-center mb-4 text-yellow-400">Loading data...</div>

        <!-- Stats -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8" id="stats"></div>

        <!-- Exchanges -->
        <div class="card rounded-xl p-6 mb-8">
            <h2 class="text-2xl font-semibold mb-4"><i class="fas fa-exchange-alt"></i> Top Exchange Volumes</h2>
            <div id="exchanges" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
        </div>

        <!-- Trades -->
        <div class="card rounded-xl p-6 mb-8">
            <h2 class="text-2xl font-semibold mb-4"><i class="fas fa-list"></i> Recent Binance Trades</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-sm" id="trades-table">
                    <thead><tr class="border-b"><th>Time</th><th>Price</th><th>Qty</th><th>Total</th></tr></thead>
                    <tbody id="trades-body"></tbody>
                </table>
            </div>
        </div>

        <!-- Order Book -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="card rounded-xl p-6">
                <h2 class="text-2xl font-semibold mb-4 text-green-400">Bids (Buy)</h2>
                <div id="bids" class="max-h-96 overflow-auto"></div>
            </div>
            <div class="card rounded-xl p-6">
                <h2 class="text-2xl font-semibold mb-4 text-red-400">Asks (Sell)</h2>
                <div id="asks" class="max-h-96 overflow-auto"></div>
            </div>
        </div>

        <footer class="text-center text-slate-500 mt-12 text-sm">
            Public APIs • Try different networks if stuck
        </footer>
    </div>

    <script>
        const PROXY = "https://corsproxy.io/?";   // More reliable one

        async function fetchJSON(url) {
            try {
                const fullUrl = PROXY + encodeURIComponent(url);
                const res = await fetch(fullUrl);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return await res.json();
            } catch (e) {
                console.error("Fetch failed for", url, e);
                return null;
            }
        }

        async function loadMarketData() {
            const data = await fetchJSON("https://api.coingecko.com/api/v3/coins/ripple?localization=false&market_data=true");
            if (!data) return;
            const m = data.market_data;
            const html = `
                <div class="card rounded-xl p-6">
                    <div class="text-5xl font-bold">$${m.current_price.usd.toFixed(4)}</div>
                    <div class="${m.price_change_percentage_24h >= 0 ? 'positive' : 'negative'} text-xl">
                        ${m.price_change_percentage_24h?.toFixed(2)}% 24h
                    </div>
                </div>
                <div class="card rounded-xl p-6 text-sm">
                    <div>Vol 24h: $${(m.total_volume.usd/1e9).toFixed(1)}B</div>
                    <div>MCap: $${(m.market_cap.usd/1e9).toFixed(1)}B</div>
                </div>
                <div class="card rounded-xl p-6 text-sm">
                    <div>High 24h: $${m.high_24h.usd}</div>
                    <div>Low 24h: $${m.low_24h.usd}</div>
                </div>
            `;
            document.getElementById('stats').innerHTML = html;
        }

        // ... (loadExchanges, loadRecentTrades, loadOrderBook similar to before - using the new PROXY)

        async function loadExchanges() {
            const data = await fetchJSON("https://api.coingecko.com/api/v3/coins/ripple/tickers");
            if (!data) return;
            // same as previous version...
            let html = '';
            const top = data.tickers.slice(0,8).filter(t => ['Binance','Coinbase','Kraken','Bybit'].some(n => t.market.name.includes(n)));
            top.forEach(t => {
                html += `<div class="card p-4"><div class="font-semibold">${t.market.name}</div><div class="text-xl">${t.last}</div></div>`;
            });
            document.getElementById('exchanges').innerHTML = html || 'No data';
        }

        async function loadRecentTrades() {
            const trades = await fetchJSON("https://api.binance.com/api/v3/trades?symbol=XRPUSDT&limit=15");
            if (!trades) return;
            let html = '';
            trades.forEach(t => {
                const isBuy = !t.isBuyerMaker;
                html += `<tr class="${isBuy ? 'text-green-400' : 'text-red-400'} border-b"><td>${new Date(t.time).toLocaleTimeString()}</td><td>${parseFloat(t.price).toFixed(4)}</td><td>${parseFloat(t.qty).toFixed(2)}</td><td>$${(parseFloat(t.price)*parseFloat(t.qty)).toFixed(0)}</td></tr>`;
            });
            document.getElementById('trades-body').innerHTML = html;
        }

        async function loadOrderBook() {
            const book = await fetchJSON("https://api.binance.com/api/v3/depth?symbol=XRPUSDT&limit=15");
            if (!book) return;
            // Bids and Asks tables (same logic as before)
            let bidsHTML = '<table class="w-full"><tr><th>Price</th><th>Qty</th><th>Cum</th></tr>';
            let cum = 0;
            book.bids.forEach(b => { cum += parseFloat(b[1]); bidsHTML += `<tr class="text-green-400"><td>${parseFloat(b[0]).toFixed(4)}</td><td>${parseFloat(b[1]).toFixed(2)}</td><td>${cum.toFixed(0)}</td></tr>`; });
            bidsHTML += '</table>';
            document.getElementById('bids').innerHTML = bidsHTML;

            let asksHTML = '<table class="w-full"><tr><th>Price</th><th>Qty</th><th>Cum</th></tr>';
            cum = 0;
            book.asks.forEach(a => { cum += parseFloat(a[1]); asksHTML += `<tr class="text-red-400"><td>${parseFloat(a[0]).toFixed(4)}</td><td>${parseFloat(a[1]).toFixed(2)}</td><td>${cum.toFixed(0)}</td></tr>`; });
            asksHTML += '</table>';
            document.getElementById('asks').innerHTML = asksHTML;
        }

        async function refreshAll() {
            document.getElementById('status').textContent = 'Fetching fresh data...';
            await Promise.all([loadMarketData(), loadExchanges(), loadRecentTrades(), loadOrderBook()]);
            document.getElementById('status').textContent = 'Updated ✓';
            setTimeout(() => document.getElementById('status').textContent = '', 3000);
        }

        window.onload = () => {
            refreshAll();
            setInterval(refreshAll, 30000);
        };
    </script>
</body>
</html>
